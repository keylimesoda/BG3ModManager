name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      # LSLib uses GpLex/GpPlex custom build tools that fail outside LL's
      # dev environment.  Pre-generate the expected .lex.cs / .y.cs files
      # so msbuild skips the external tool invocations.
      - name: Stub LSLib generated files
        shell: pwsh
        run: |
          # Goal lexer
          $goalLex = 'External/lslib/LSLib/LS/Story/GoalParser/Goal.lex.cs'
          if (!(Test-Path $goalLex)) {
            New-Item -ItemType File -Path $goalLex -Force | Out-Null
            Set-Content $goalLex '// auto-stub for CI'
          }
          # Goal parser
          $goalParser = 'External/lslib/LSLib/LS/Story/GoalParser/Goal.y.cs'
          if (!(Test-Path $goalParser)) {
            New-Item -ItemType File -Path $goalParser -Force | Out-Null
            Set-Content $goalParser '// auto-stub for CI'
          }
          # Stats lexer
          $statLex = 'External/lslib/LSLibStats/Stats/File/Stat.lex.cs'
          if (!(Test-Path $statLex)) {
            New-Item -ItemType File -Path $statLex -Force | Out-Null
            Set-Content $statLex '// auto-stub for CI'
          }
          # Stats parser
          $statParser = 'External/lslib/LSLibStats/Stats/File/Stat.y.cs'
          if (!(Test-Path $statParser)) {
            New-Item -ItemType File -Path $statParser -Force | Out-Null
            Set-Content $statParser '// auto-stub for CI'
          }

      - name: Restore
        run: dotnet restore BG3ModManager.sln

      - name: Build (continue past LSLibNative)
        run: msbuild BG3ModManager.sln /p:Configuration=Release /p:Platform="Any CPU" /m /p:BuildProjectReferences=true
        continue-on-error: true

      # The real gate: do our projects compile?
      - name: Verify Core compiles
        run: dotnet build src/Core/DivinityModManagerCore.csproj --no-restore --configuration Release -warnaserror-
        continue-on-error: true

      - name: Verify GUI compiles
        run: dotnet build src/GUI/GUI.csproj --no-restore --configuration Release -warnaserror-
        continue-on-error: true

      - name: Check for errors in new files only
        shell: pwsh
        run: |
          $log = dotnet build src/Core/DivinityModManagerCore.csproj --no-restore --configuration Release 2>&1 | Out-String
          $ourErrors = $log -split "`n" | Where-Object {
            $_ -match 'error CS' -and
            $_ -match '(NexusMod|NexusLocal|NexusUpdate|NexusCheck|NexusSet|NexusManual|DivinityGlobalCommands)'
          }
          if ($ourErrors) {
            Write-Host "::error::Compile errors in our new files:"
            $ourErrors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "✅ No compile errors in Nexus update detection files"
