name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BG3ModManager.sln

      - name: Build
        run: dotnet build BG3ModManager.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BG3ModManager.sln --no-build --configuration Release --verbosity normal
