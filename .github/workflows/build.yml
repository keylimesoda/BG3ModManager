name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore BG3ModManager.sln

      - name: Build
        run: msbuild BG3ModManager.sln /p:Configuration=Release /p:Platform="Any CPU" /m
