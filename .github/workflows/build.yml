name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download upstream release
        shell: pwsh
        run: |
          gh release download 1.0.12.9 --repo LaughingLeader/BG3ModManager --pattern '*.zip' --dir .
          Expand-Archive -Path BG3ModManager_Latest.zip -DestinationPath upstream-release -Force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Patch csproj for CI
        shell: pwsh
        run: |
          $csproj = "src/Core/DivinityModManagerCore.csproj"
          $lines = Get-Content $csproj
          $newLines = @()
          $inserted = $false
          foreach ($line in $lines) {
            if ($line -match 'ProjectReference.*External.*(lslib|CrossSpeak)') {
              continue
            }
            $newLines += $line
            if (-not $inserted -and $line -match '</ItemGroup>') {
              $lslib = (Resolve-Path "upstream-release/_Lib/LSLib.dll").Path
              $native = (Resolve-Path "upstream-release/_Lib/LSLibNative.dll").Path
              $cross = (Resolve-Path "upstream-release/_Lib/CrossSpeak.dll").Path
              $newLines += "  <ItemGroup>"
              $newLines += "    <Reference Include=`"LSLib`"><HintPath>$lslib</HintPath></Reference>"
              $newLines += "    <Reference Include=`"LSLibNative`"><HintPath>$native</HintPath></Reference>"
              $newLines += "    <Reference Include=`"CrossSpeak`"><HintPath>$cross</HintPath></Reference>"
              $newLines += "  </ItemGroup>"
              $inserted = $true
            }
          }
          $newLines | Set-Content $csproj -Encoding UTF8
          Write-Host "Patched csproj"

      - name: Restore Core
        run: dotnet restore src/Core/DivinityModManagerCore.csproj

      - name: Restore GUI
        run: dotnet restore src/GUI/GUI.csproj

      - name: Build Core
        run: dotnet build src/Core/DivinityModManagerCore.csproj --no-restore --configuration Release

      - name: Build GUI
        run: dotnet build src/GUI/GUI.csproj --no-restore --configuration Release

      - name: Package release
        shell: pwsh
        run: |
          $coreDll = Get-ChildItem -Recurse -Filter "DivinityModManagerCore.dll" -Path "src" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          $guiDll = Get-ChildItem -Recurse -Filter "BG3ModManager.dll" -Path "src" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $coreDll) { $coreDll = Get-ChildItem -Recurse -Filter "DivinityModManagerCore.dll" -Path "bin" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1 }
          if (-not $guiDll) { $guiDll = Get-ChildItem -Recurse -Filter "BG3ModManager.dll" -Path "bin" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1 }
          $swapped = 0
          if ($coreDll) {
            Copy-Item $coreDll.FullName "upstream-release/_Lib/DivinityModManagerCore.dll" -Force
            Write-Host "Swapped Core: $($coreDll.FullName)"
            $swapped++
          } else {
            Write-Host "::error::Core DLL not found"
          }
          if ($guiDll) {
            Copy-Item $guiDll.FullName "upstream-release/BG3ModManager.dll" -Force
            Write-Host "Swapped GUI: $($guiDll.FullName)"
            $swapped++
          } else {
            Write-Host "::error::GUI DLL not found"
          }
          Compress-Archive -Path "upstream-release/*" -DestinationPath "BG3ModManager_NexusUpdate.zip" -Force
          $size = [math]::Round((Get-Item "BG3ModManager_NexusUpdate.zip").Length / 1MB, 1)
          Write-Host "Package: $size MB ($swapped/2 DLLs swapped)"
          if ($swapped -lt 1) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BG3ModManager-NexusUpdate
          path: BG3ModManager_NexusUpdate.zip
          if-no-files-found: error
