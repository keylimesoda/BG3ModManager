name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      # LSLib uses GpLex/GpPlex custom build tools that fail outside LL's
      # dev environment. Stub the expected generated files.
      - name: Stub LSLib generated files
        shell: pwsh
        run: |
          $stubs = @(
            'External/lslib/LSLib/LS/Story/GoalParser/Goal.lex.cs',
            'External/lslib/LSLib/LS/Story/GoalParser/Goal.y.cs',
            'External/lslib/LSLibStats/Stats/File/Stat.lex.cs',
            'External/lslib/LSLibStats/Stats/File/Stat.y.cs'
          )
          foreach ($f in $stubs) {
            if (!(Test-Path $f)) {
              New-Item -ItemType File -Path $f -Force | Out-Null
              Set-Content $f '// auto-stub for CI'
            }
          }

      - name: Restore
        run: dotnet restore BG3ModManager.sln

      - name: Build (Publish config)
        run: msbuild BG3ModManager.sln /p:Configuration=Publish "/p:Platform=Any CPU" /m
        continue-on-error: true

      # Verify our Nexus code compiles clean
      - name: Verify Nexus files compile clean
        shell: pwsh
        run: |
          $log = dotnet build src/Core/DivinityModManagerCore.csproj --no-restore --configuration Release 2>&1 | Out-String
          $LASTEXITCODE = 0
          $ourErrors = $log -split "`n" | Where-Object {
            $_ -match 'error CS' -and
            $_ -match '(NexusMod|NexusLocal|NexusUpdate|NexusCheck|NexusSet|NexusManual|DivinityGlobalCommands)'
          }
          if ($ourErrors) {
            Write-Host "::error::Compile errors in Nexus update detection files:"
            $ourErrors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "No compile errors in Nexus update detection files"

      # Package the build output as a downloadable artifact
      - name: Package build
        shell: pwsh
        run: |
          # LL's csproj uses $(SolutionDir)\bin\$(Configuration)\ as output
          $candidates = @('bin\Publish', 'bin/Publish', 'bin\Release', 'bin/Release')
          $outDir = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $outDir = $c
              break
            }
          }
          if ($outDir) {
            $count = (Get-ChildItem $outDir -Recurse -File | Measure-Object).Count
            Write-Host "Packaging $count files from $outDir"
            Compress-Archive -Path "$outDir\*" -DestinationPath "BG3ModManager_NexusUpdate.zip" -Force
          } else {
            Write-Host "::warning::No build output found. Listing bin/:"
            Get-ChildItem bin -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object FullName
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BG3ModManager-NexusUpdate
          path: BG3ModManager_NexusUpdate.zip
          if-no-files-found: warn
