name: Build

on:
  push:
    branches: [ feature/nexus-update-detection, master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      # LSLib uses GpLex/GpPlex custom build tools that fail outside LL's
      # dev environment. Stub the expected generated files.
      - name: Stub LSLib generated files
        shell: pwsh
        run: |
          $stubs = @(
            'External/lslib/LSLib/LS/Story/GoalParser/Goal.lex.cs',
            'External/lslib/LSLib/LS/Story/GoalParser/Goal.y.cs',
            'External/lslib/LSLibStats/Stats/File/Stat.lex.cs',
            'External/lslib/LSLibStats/Stats/File/Stat.y.cs'
          )
          foreach ($f in $stubs) {
            if (!(Test-Path $f)) {
              New-Item -ItemType File -Path $f -Force | Out-Null
              Set-Content $f '// auto-stub for CI'
            }
          }

      - name: Restore
        run: dotnet restore BG3ModManager.sln

      - name: Build
        run: msbuild BG3ModManager.sln /p:Configuration=Release "/p:Platform=Any CPU" /m
        continue-on-error: true

      # Gate: verify no compile errors in OUR new Nexus files
      - name: Verify Nexus files compile clean
        shell: pwsh
        run: |
          $log = dotnet build src/Core/DivinityModManagerCore.csproj --no-restore --configuration Release 2>&1 | Out-String
          $LASTEXITCODE = 0  # Reset — LSLib errors are expected
          $ourErrors = $log -split "`n" | Where-Object {
            $_ -match 'error CS' -and
            $_ -match '(NexusMod|NexusLocal|NexusUpdate|NexusCheck|NexusSet|NexusManual|DivinityGlobalCommands)'
          }
          if ($ourErrors) {
            Write-Host "::error::Compile errors in Nexus update detection files:"
            $ourErrors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "No compile errors in Nexus update detection files"
